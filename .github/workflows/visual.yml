name: Visual Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 基準画像の候補を生成する（外部基準の切り替えは別の手動承認）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更ファイルを判定
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.changes.outputs.typecheck }}
      tests: ${{ steps.changes.outputs.tests }}
      react_compat: ${{ steps.changes.outputs.react_compat }}
      build: ${{ steps.changes.outputs.build }}
      storybook: ${{ steps.changes.outputs.storybook }}
      visual: ${{ steps.changes.outputs.visual }}
    steps:
      - name: 比較に必要な履歴を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: チェックごとの実行条件を判定
        id: changes
        run: bun scripts/ci-changes.ts

  visual:
    name: tkw-visual
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.visual == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Bunの展開に必要なunzipを準備
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip

      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Firefox用ホームの所有者を実行ユーザーに合わせる
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: 基準画像と比較
        if: ${{ !inputs.update_baselines }}
        run: bun run test:visual

      - name: 基準画像を生成・更新
        if: ${{ inputs.update_baselines }}
        run: bun run test:visual:update

      - name: 画像一覧とレポートを7日間保存
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 承認前の基準画像候補を7日間保存
        if: ${{ success() && inputs.update_baselines }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: .visual-candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: 閲覧URLを実行結果へ表示
        if: ${{ !cancelled() && steps.report.outputs.artifact-id && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          REPORT_ID: ${{ steps.report.outputs.artifact-id }}
        run: |
          echo "画像一覧（公開処理の完了後）: https://hikaritakahashi.github.io/tokiwagi-ui-visual-results/runs/${GITHUB_RUN_ID}-${REPORT_ID}/gallery.html" >> "$GITHUB_STEP_SUMMARY"
