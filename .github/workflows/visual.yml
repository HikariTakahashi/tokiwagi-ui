name: Visual Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 基準画像の候補を生成する（外部基準の切り替えは別の手動承認）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: tkw-visual
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Bunの展開に必要なunzipを準備
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends unzip

      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: 依存関係をインストール
        run: bun install --frozen-lockfile

      - name: Firefox用ホームの所有者を実行ユーザーに合わせる
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: 基準画像と比較
        if: ${{ !inputs.update_baselines }}
        run: bun run test:visual

      - name: 基準画像を生成・更新
        if: ${{ inputs.update_baselines }}
        run: bun run test:visual:update

      - name: 画像一覧とレポートを7日間保存
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: 承認前の基準画像候補を7日間保存
        if: ${{ success() && inputs.update_baselines }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: visual-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: .visual-candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
