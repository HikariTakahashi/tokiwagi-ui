name: Prepare Copilot Code Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

permissions: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: レビュー対象を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: Storybookを起動する
        run: |
          nohup bun run storybook --ci </dev/null >"$RUNNER_TEMP/copilot-storybook.log" 2>&1 &
          storybook_pid=$!
          for attempt in {1..40}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:6006/index.json >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$storybook_pid" 2>/dev/null; then break; fi
            sleep 3
          done
          tail -40 "$RUNNER_TEMP/copilot-storybook.log"
          exit 1
