name: Transfer Visual Reports

on:
  workflow_run:
    workflows: [Visual Tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 再転送するVisual Testsの実行ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-report-transfer-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'HikariTakahashi/tokiwagi-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: 信頼済みの転送処理をmainから取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - name: 画像保管用リポジトリへZIPを転送して公開更新を通知
        id: transfer
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_STORAGE_TOKEN: ${{ secrets.VISUAL_STORAGE_TOKEN }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: bun run visual:transfer "$SOURCE_RUN"
      - name: 公開を確認してPRコメントに結果と画像を表示
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
          REPORT_TRANSFER_OUTCOME: ${{ steps.transfer.outcome }}
        run: bun scripts/visual-comment.ts "$SOURCE_RUN"
