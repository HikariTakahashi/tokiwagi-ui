name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 変更ファイルを判定
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.changes.outputs.typecheck }}
      tests: ${{ steps.changes.outputs.tests }}
      react_compat: ${{ steps.changes.outputs.react_compat }}
      build: ${{ steps.changes.outputs.build }}
      storybook: ${{ steps.changes.outputs.storybook }}
      visual: ${{ steps.changes.outputs.visual }}
    steps:
      - name: 比較に必要な履歴を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: チェックごとの実行条件を判定
        id: changes
        run: bun scripts/ci-changes.ts

  typecheck:
    name: tkw-typecheck
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.typecheck == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: tkw-typecheckを実行
        run: bun run check

  tests:
    name: tkw-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: tkw-testsを実行
        run: bun test

  react_compat:
    name: tkw-react-compat
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.react_compat == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: tkw-react-compatを実行
        run: bun run check:react-compat

  build:
    name: tkw-build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: tkw-buildを実行
        run: bun run build

  storybook:
    name: tkw-storybook
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.storybook == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 変更判定の失敗を検証失敗として報告
        if: ${{ needs.changes.result != 'success' }}
        run: exit 1
      - name: 検証対象のコードを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'
      - name: 依存関係をインストール
        run: bun install --frozen-lockfile
      - name: tkw-storybookを実行
        run: bun run build:storybook
