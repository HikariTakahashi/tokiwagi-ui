name: Restore AI Review Status

on:
  schedule:
    - cron: '2-59/5 * * * *'

permissions: {}

concurrency:
  group: restore-ai-review-status

jobs:
  restore:
    name: 未登録のAIレビュー完了ステータスを復元
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: デフォルトブランチの判定スクリプトと履歴を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: 現在のマージ用コミットへ完了を再登録
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ai-review-completion.ts --restore
