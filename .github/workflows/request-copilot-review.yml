name: Request Copilot Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: UI・パフォーマンスへの影響を判定
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      review: ${{ steps.changes.outputs.review }}
    steps:
      # PR側のファイルは差分データとして取得し、ベース側の判定スクリプトだけを実行する。
      - name: ベース側のコードと履歴を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - name: 変更ファイルからCopilotの要否を判定
        id: changes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head" || echo "PR側の履歴取得に失敗。判定スクリプトで比較可能か確認します。"
          bun scripts/copilot-review-changes.ts

  request:
    name: Copilotへレビューを依頼
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'failure' || needs.changes.outputs.review == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: ベース側の依頼スクリプトを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - name: 最新のPRにCopilotレビューを依頼
        env:
          # 自動トークンで依頼できない場合のみ、対応するリポジトリSecretを設定する。
          REVIEW_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/request-copilot-review.ts

  completion:
    name: AIレビューの完了を確認
    needs: [changes, request]
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: ベース側の判定スクリプトを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'
      - name: 両レビューの結果を確認
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COPILOT_REQUIRED: ${{ needs.changes.result != 'success' || needs.changes.outputs.review != 'false' }}
        run: bun scripts/ai-review-completion.ts
