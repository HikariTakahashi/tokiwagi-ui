name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync-wiki.ts'
      - 'scripts/sync-wiki.test.ts'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'HikariTakahashi/tokiwagi-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 最新のmainを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Bunを準備
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - name: 同期処理を検証
        working-directory: source
        run: bun test scripts/sync-wiki.test.ts

      - name: Wikiの既定ブランチを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: 原稿と管理対象ページの削除を同期
        run: bun source/scripts/sync-wiki.ts source/docs/wiki wiki

      - name: Wikiを公開
        working-directory: wiki
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'Wiki同期: 差分なし' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          source_sha=$(git -C ../source rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs(wiki): sync from ${source_sha}"
          git push origin HEAD
          echo "Wiki同期完了: ${source_sha}" >> "$GITHUB_STEP_SUMMARY"
