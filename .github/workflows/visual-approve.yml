name: Approve Visual Baselines

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 画像を確認した候補生成の実行ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visual-baseline-approval
  cancel-in-progress: false

jobs:
  approve:
    if: github.repository == 'HikariTakahashi/tokiwagi-ui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.9'

      - run: bun install --frozen-lockfile

      - name: 候補の64条件と生成元を検証して外部基準を切り替える
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_STORAGE_TOKEN: ${{ secrets.VISUAL_STORAGE_TOKEN }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: bun scripts/visual-storage.ts promote-run "$SOURCE_RUN"
